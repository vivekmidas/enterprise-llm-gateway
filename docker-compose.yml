services:
  backend:
    build: ./backend
    ports:
      - 8000:8000
      - 8888:8888
    env_file:
      - backend/.env.local
    volumes:
      - ./backend:/app
    restart: unless-stopped
    depends_on:
      - redis
      - mysql

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file:
      - frontend/.env.local
    restart: unless-stopped
    depends_on:
      - backend

  redis:
    image: redis:8.8.0-alpine
    container_name: gateway-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant
    container_name: gateway-qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage
    restart: unless-stopped

  mysql:
    # Updated MySQL container with root credentials and database initialization
    image: mysql:8.0
    container_name: gateway-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: enterprise_gateway
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10

    
