services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build: ./enterprise-llm-frontend
    ports:
      - "3000:3000"
    env_file:
      - enterprise-llm-frontend/.env.local
    restart: unless-stopped
    depends_on:
      - backend
