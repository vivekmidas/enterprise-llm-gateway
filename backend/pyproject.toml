[project]
name = "enterprise-llm-gateway"
version = "0.2.2"
description = "Enterprise LLM Gateway with Guardrails, Agents & Workflow Engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.9.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "spacy>=3.7.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "httpx>=0.27.0",
]

[tool.uv]
dev-dependencies = ["pytest>=8.0.0", "black>=24.0.0"]