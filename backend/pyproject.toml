[project]
name = "backend"
version = "0.2.3"
description = "Enterprise-grade LLM Gateway with LangGraph workflows, observability, and guardrails."
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "pydantic>=2.0",
    "pydantic-settings",
    "redis>=4.2.0",
    "structlog>=25.5.0",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-httpx",
    "prometheus-fastapi-instrumentator",
    "opentelemetry-exporter-otlp",
    "langgraph",
    "langchain",
    "spacy",
    "rich",
    "sqlalchemy",
    "langchain-openai",
    "presidio_anonymizer",
    "presidio_analyzer",
    
    "httpx",

]
dev = [
  { include-group = "prod" },
  { include-group = "docs" },
  { include-group = "release-tools" },
  "ruff",
  "coverage",
  "pytest",
  "pytest-syncio",
  "pytest-cov"
  
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "B", "C4", "UP", "SIM", "TID", "RUF"]
ignore = ["E501"]  # Will adjust later

[tool.ruff.lint]
extend-select = ["I"]  # isort

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true